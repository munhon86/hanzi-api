default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("POSTGRES_HOST", "localhost") %>
  port: <%= ENV.fetch("POSTGRES_PORT", 5432) %>
  username: <%= ENV.fetch("POSTGRES_USER", "hanzi") %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD", "hanzi") %>

development:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_DB", "hanzi_api_development") %>

test:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_TEST_DB", "hanzi_api_test") %>

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
