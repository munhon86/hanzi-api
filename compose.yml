services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: hanzi
      POSTGRES_PASSWORD: hanzi
      POSTGRES_DB: hanzi_api_development
    ports:
      - "5432:5432"
    volumes:
      - hanzi_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hanzi -d hanzi_api_development"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
    command: bash -lc "bin/rails db:prepare && bin/rails server -b 0.0.0.0"
    environment:
      RAILS_ENV: development
      POSTGRES_HOST: db
      POSTGRES_USER: hanzi
      POSTGRES_PASSWORD: hanzi
      POSTGRES_DB: hanzi_api_development
    ports:
      - "3000:3000"
    volumes:
      - .:/rails
      - bundle:/usr/local/bundle
    depends_on:
      db:
        condition: service_healthy

volumes:
  hanzi_postgres:
  bundle:
